[supervisord]
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=true

; Laravel PHP-FPM
[program:php-fpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/var/log/php-fpm.log
stderr_logfile=/var/log/php-fpm.error.log

; Nginx
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.log
stderr_logfile=/var/log/nginx.error.log
priority=999

; Queue Worker
[program:queue]
process_name=%(program_name)s_%(process_num)02d
command=php artisan queue:work redis --tries=3 --timeout=90 --max-jobs=1000 --max-time=3600
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/queue.log
stopwaitsecs=3600

; Laravel Reverb WebSocket
[program:reverb]
process_name=%(program_name)s
command=php artisan reverb:start --host=127.0.0.1 --port=6001
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/reverb.log
stopwaitsecs=60

; Scheduler
[program:scheduler]
process_name=%(program_name)s
command=php artisan schedule:work
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/scheduler.log
stopwaitsecs=60
